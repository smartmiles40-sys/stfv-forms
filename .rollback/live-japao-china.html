      var name = el.getAttribute('data-campo');
      var tipo = el.type;
      if (tipo === 'radio') {
        el.addEventListener('change', function () { valores[name] = el.value; erros[name] = ''; });
      } else if (tipo === 'checkbox' && el.getAttribute('data-consent')) {
        el.addEventListener('change', function () { valores[name] = el.checked ? 'sim' : ''; erros[name] = ''; });
      } else if (tipo === 'checkbox') {
        el.addEventListener('change', function () {
          var atual = Array.isArray(valores[name]) ? valores[name].slice() : [];
          var i = atual.indexOf(el.value);
          if (el.checked && i < 0) atual.push(el.value);
          if (!el.checked && i >= 0) atual.splice(i, 1);
          valores[name] = atual; erros[name] = '';
        });
      } else {
        el.addEventListener('input', function () {
          var campo = acharCampo(name);
          if (campo && campo.tipo === 'whatsapp') el.value = mascaraWhatsapp(el.value);
          if (campo && campo.tipo === 'instagram') el.value = mascaraInstagram(el.value);
          valores[name] = el.value; erros[name] = '';
        });
      }
    });
  }

  function acharCampo(name) {
    for (var i = 0; i < ETAPAS.length; i++) {
      var achado = ETAPAS[i].campos.filter(function (c) { return c.name === name; })[0];
      if (achado) return achado;
    }
    return null;
  }

  function iniciarTrava() {}

  // ==== Fluxo ============================================================
  function validarEtapa() {
    var etapa = ETAPAS[indice];
    var ok = true;
    etapa.campos.forEach(function (campo) {
      var v = valores[campo.name];
      if (v === undefined) v = campo.tipo === 'checkbox' ? [] : '';
      var msg = validarCampo(campo, v);
      erros[campo.name] = msg;
      if (msg) {
        ok = false;
        pushDataLayer('form_validation_error', { step: indice + 1, field: campo.name });
      }
    });
    return ok;
  }

  function avancar() {
    var etapa = ETAPAS[indice];
    if (etapa.tipo === 'video' && !liberados[indice]) return;
    if (!validarEtapa()) { render(); return; }
    if (!sessionStorage.getItem(LEAD_ID_KEY)) sessionStorage.setItem(LEAD_ID_KEY, gerarLeadId());
    pushDataLayer('form_step_complete', { step: indice + 1, lead_id: sessionStorage.getItem(LEAD_ID_KEY) });
    indice = Math.min(indice + 1, ETAPAS.length - 1);
    pushDataLayer('form_step_view', { step: indice + 1 });
    render();
  }

  function montarPayload(leadId) {
    var respostas = {};
    ETAPAS.forEach(function (et) {
      et.campos.forEach(function (campo) {
        if (campo.tipo === 'oculto') { respostas[campo.name] = campo.valorFixo || ''; return; }
        var v = valores[campo.name];
        var texto = Array.isArray(v) ? v.join(', ') : String(v == null ? '' : v);
        // WhatsApp em E.164 e e-mail minúsculo: é o formato que o CRM espera,
        // e no modo webhook direto não há backend pra normalizar depois.
        if (campo.tipo === 'whatsapp') texto = texto ? '+55' + texto.replace(/\D/g, '') : '';
        if (campo.tipo === 'email') texto = texto.trim().toLowerCase();
        respostas[campo.name] = texto;
      });
    });
    var payload = { lead_id: leadId };
    for (var f in CAMPOS_FIXOS) payload[f] = CAMPOS_FIXOS[f];
    for (var r in respostas) payload[r] = respostas[r];
    for (var t in track) payload[t] = track[t];
    payload.form_name = FORM_NAME;
    payload.slug = SLUG;
    payload.timestamp = new Date().toISOString();
    payload.etapa = 'completo';
    payload.formulario_completo = true;
    return { payload: payload, respostas: respostas };
  }

  /** Pra onde este lead vai, dada a resposta dele. */
  function destinoDoLead(respostas) {
    for (var i = 0; i < REGRAS_SAIDA.length; i++) {
      var regra = REGRAS_SAIDA[i];
      if (respostas[regra.campo] === regra.valor)
        return { url: regra.url, whatsapp: regra.whatsapp };
    }
    return { url: REDIRECT_URL, whatsapp: WHATSAPP_HANDOFF };
  }

  function concluir(respostas) {
    sessionStorage.removeItem(LEAD_ID_KEY);
    var saida = destinoDoLead(respostas);
    var url = saida.url;
    if (saida.whatsapp) {
      var msg = WHATSAPP_MSG.replace(/\{(\w+)\}/g, function (_m, chave) {
        return String(respostas[chave] == null ? '' : respostas[chave]).trim();
      });
      try {
        sessionStorage.setItem('stfv_wa_msg', msg);
        sessionStorage.removeItem('stfv_wa_redirecionado');
      } catch (e) {}
      // Indo direto pro WhatsApp a mensagem tem que ir na URL: o sessionStorage
      // so e lido quando existe uma pagina de obrigado nossa no meio.
      if (/wa\.me|api\.whatsapp\.com/.test(url))
        url += (url.indexOf('?') === -1 ? '?' : '&') + 'text=' + encodeURIComponent(msg);
    }
    if (APOS_ENVIO === 'redirect') window.location.href = url;
    else renderSucesso();
  }

  function enviar() {
    var etapa = ETAPAS[indice];
    if (etapa.tipo === 'video' && !liberados[indice]) return;
    erroDeEnvio = false;
    if (!validarEtapa()) { render(); return; }

    var leadId = sessionStorage.getItem(LEAD_ID_KEY) || gerarLeadId();
    sessionStorage.setItem(LEAD_ID_KEY, leadId);
    var montado = montarPayload(leadId);

    enviando = true;
    render();

    fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(montado.payload)
    })
      .then(function (resp) {
        if (!resp.ok) throw new Error('envio ' + resp.status);
        var navegou = false;
        var fim = function () { if (navegou) return; navegou = true; concluir(montado.respostas); };
        if (USA_DATALAYER) {
          var respSlugs = {};
          for (var name in SLUGS_DE_RESPOSTA) {
            respSlugs[name] = SLUGS_DE_RESPOSTA[name][montado.respostas[name]] || '';
          }
          window.dataLayer = window.dataLayer || [];
          var evento = {
            event: EVENTO_CONVERSAO,
            form_name: FORM_NAME,
            destino: SLUG,
            event_id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()),
            lead: {
              nome: montado.respostas.nome || '',
              email: montado.respostas.email || '', // já normalizado acima
              whatsapp: montado.respostas.whatsapp || '', // já em E.164
              instagram: montado.respostas.instagram || ''
            },
            resp: respSlugs,
            eventCallback: fim,
            eventTimeout: 2000
          };
          for (var k in track) evento[k] = track[k];
          window.dataLayer.push(evento);
          // Rede de seguranca: se o GTM nao chamar o callback, conclui mesmo assim.
          setTimeout(fim, 2000);
        } else {
          fim();
        }
      })
      .catch(function () {
        if (APOS_ENVIO === 'redirect') {
          // O envio falhou, mas segurar o lead aqui e o pior dos dois males:
          // quem chega no destino a gente ja tem (o numero esta na conversa),
          // quem fica parado numa mensagem de erro some. Ultima tentativa de
          // salvar com sendBeacon, que sobrevive a saida da pagina, e vai.
          try {
            if (navigator.sendBeacon) {
              navigator.sendBeacon(
                ENDPOINT,
                new Blob([JSON.stringify(montado.payload)], { type: 'application/json' })
              );
            }
          } catch (e) { /* sem rede: vai pro destino do mesmo jeito */ }
          concluir(montado.respostas);
          return;
        }
        erroDeEnvio = true;
        enviando = false;
        render();
      });
  }

  // ==== Boot =============================================================
  capturarTrack();
  pushDataLayer('form_step_view', { step: 1 });
  render();
})();
</script>
